[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earlyflag"
version = "0.2.0"
description = "Early-warning model for university dropout, built around advisor capacity, calibration and fairness."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ebrahim Jahangiri" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
